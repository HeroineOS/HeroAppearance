[package]
name = "heroappearance"
version = "0.1.7"
description = "Appearance: customize the HeroUI theme and HeroBar"
repository = "https://github.com/HeroineOS/HeroAppearance"
license = "MIT OR Apache-2.0"
edition = "2021"

[dependencies]
heroui = { git = "https://github.com/HeroineOS/HeroUI" }
toml_edit = { version = "0.23", default-features = false, features = ["parse", "display"] }

# HeroineOS apps use the HeroineOS fltk-sys fork (Wayland touch input; same
# API as fltk-sys 1.5.23).
[patch.crates-io]
fltk-sys = { git = "https://github.com/HeroineOS/fltk-sys" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "HeroineOS <https://github.com/HeroineOS>"
copyright = "HeroineOS contributors"
section = "x11"
priority = "optional"
depends = "$auto"
recommends = "herobar"
extended-description = """\
Appearance (heroappearance) customizes the HeroUI theme used by every HeroUI \
program (colors, radius, spacing, font, animations) and HeroBar (position, size, \
modules and their settings). Changes apply live; HeroBar picks them up within a \
second, and comments in bar.toml are kept."""
assets = [
    ["target/release/heroappearance", "usr/bin/", "755"],
    ["res/heroappearance.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/heroappearance/README.md", "644"],
]
